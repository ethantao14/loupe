name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Cache the embedding weights so the semantic recall tests run here rather
      # than skipping, which is how a broken ranker could ship green.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-voyage-4-nano-v1
      - run: pip install -r requirements-dev.txt
      - run: huggingface-cli download voyageai/voyage-4-nano
      - run: ruff check .
      - run: mypy app
      # -rs reports why anything skipped, so a silently skipped container
      # test cannot be mistaken for a passing one.
      - run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # A broken import or a font that cannot be fetched fails only here,
      # so lint, types and tests can all pass on a build that never compiles.
      - run: npm run build
